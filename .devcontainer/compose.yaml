# Compose stack that BACKS the devcontainer. VS Code / the devcontainer CLI runs
# `docker compose up` on this file automatically when you "Reopen in Container",
# so bringing the stack up is not a separate step — opening the container IS
# firing up the compose.
#
# Difference vs the root compose.yaml (the native-host stack): there, Postgres and
# Inngest are published on localhost and the api/worker/ui run on your machine.
# Here EVERYTHING runs inside the compose network, so services address each other
# by name (db:5432, inngest:8288) — no host.docker.internal, no host-port juggling,
# which is what makes it behave identically on macOS / Windows / Linux.
#
# Host access to any port is handled by devcontainer.json `forwardPorts` (VS Code
# picks free host ports), so this file publishes nothing and can't clash with a
# native `docker compose` / Tilt run, or the known orphan-container :5439 clash.

name: smart-wroclaw-devcontainer

services:
  # The devcontainer itself. Toolchain image + the mounted source tree. It just
  # idles (`sleep infinity`); you start uvicorn / pnpm inside it from a terminal.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspaces/smart_wroclaw:cached
      # Keep the Linux virtualenv and node_modules in named volumes so they never
      # collide with a host-built .venv / ui/node_modules on the bind mount (a
      # macOS/Windows venv or native module won't run under Linux) — and so they
      # survive rebuilds and stay off the slow bind mount.
      - venv:/workspaces/smart_wroclaw/.venv
      - ui-node-modules:/workspaces/smart_wroclaw/ui/node_modules
    environment:
      # Override the host-oriented values in api/.env: inside this network
      # Postgres is `db:5432` and the Inngest dev server is `inngest:8288`.
      # (Real env vars win over the .env file in pydantic-settings.)
      CONFIG__POSTGRES__HOST: db
      CONFIG__POSTGRES__PORT: "5432"
      INNGEST_DEV: http://inngest:8288
      # Single-process dev: role=all serves REST + the Inngest function host on
      # one port (8101). Inngest points at app:8101/api/inngest below.
      SMART_WROCLAW_ROLE: all
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      # Dev-only credentials — mirror the CONFIG__POSTGRES__* defaults in api/.env.
      POSTGRES_USER: smart_wroclaw
      POSTGRES_PASSWORD: smart_wroclaw
      POSTGRES_DB: smart_wroclaw
    volumes:
      # postgres:18 stores data in a version subdir; mount the PARENT, not
      # /var/lib/postgresql/data (the pre-18 path). Named volume keeps DB state
      # out of the source tree.
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_wroclaw -d smart_wroclaw"]
      interval: 5s
      timeout: 5s
      retries: 10

  inngest:
    image: inngest/inngest:latest
    # --no-discovery stops the dev server probing random localhost ports; -u
    # points it at the app's function host. In role=all that host is on :8101.
    command: inngest dev --no-discovery -u http://app:8101/api/inngest
    restart: unless-stopped
    depends_on:
      - app

  # Local-only data-labelling UI for the eval workflow (eval/event_extractor/).
  # Paste eval/.../data/label_studio_config.xml as the project config and import
  # label_studio_import.json; export the annotations back as JSON for
  # label_studio_to_goldens.py. Data persists in the label_studio_data volume.
  label-studio:
    image: heartexlabs/label-studio:latest
    restart: unless-stopped
    environment:
      # Bootstrap a superuser so there's no signup wall, and silence the
      # outbound telemetry / "new version" pings — this instance is local only.
      LABEL_STUDIO_USERNAME: admin@smart-wroclaw.local
      LABEL_STUDIO_PASSWORD: labelstudio
      COLLECT_ANALYTICS: "false"
      LATEST_VERSION_CHECK: "false"
      # Let Label Studio read the eval datasets bind-mounted below. The document
      # root is the ONLY host path it will serve, so it's scoped to eval/ alone.
      LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED: "true"
      LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT: /label-studio/files
      # Fixed local API token so the init sidecar below can authenticate
      # deterministically. Legacy tokens must be enabled for it to be accepted.
      LABEL_STUDIO_USER_TOKEN: &ls_token "smartwroclawlocaltoken0123456789"
      LABEL_STUDIO_ENABLE_LEGACY_API_TOKEN: "true"
    volumes:
      - label_studio_data:/label-studio/data
      # Every eval dataset (eval/*/data/) shows up inside the container here, so
      # any current OR future agent's data lands in Label Studio automatically —
      # add a Local Storage in the UI pointed at /label-studio/files/<agent>/data
      # to sync tasks, or just Import that folder's label_studio_import.json.
      # Read-only keeps the gold data immutable (never edit eval/** — see README).
      # ../eval because this compose file lives in .devcontainer/, not the root.
      - ../eval:/label-studio/files:ro

  # One-shot: waits for label-studio, then PRELOADS every eval dataset that ships
  # a label_studio_config.xml + label_studio_import.json as its own project
  # ("eval:<agent>"), importing the pre-annotated tasks. Idempotent — creates a
  # project only if missing and imports only if empty — so it re-runs harmlessly
  # on every `up`. Reuses the label-studio image purely for its Python (stdlib
  # only, no extra pull), and reads the datasets from the same eval/ tree.
  label-studio-init:
    image: heartexlabs/label-studio:latest
    restart: "no"
    depends_on:
      - label-studio
    entrypoint: ["python3", "/eval/label_studio_bootstrap.py"]
    environment:
      LS_URL: http://label-studio:8080
      LS_TOKEN: *ls_token
      EVAL_ROOT: /eval
    volumes:
      - ../eval:/eval:ro

volumes:
  venv:
  ui-node-modules:
  db_data:
  label_studio_data:
