context_parser: pypyr.parser.keyvaluepairs
steps:
  - pypyr.steps.debug
  - pypyr.steps.configvars

  - name: pypyr.steps.cmd
    description: >
      Ensure ui/.next exists so the cache-clearing step below never fails on a
      fresh checkout (no-op when the directory is already there, including when
      it is the devcontainer's named-volume mount point).
    in:
      cmd: mkdir -p ui/.next

  - name: pypyr.steps.cmd
    description: >
      Clear the Next.js / Turbopack build cache before every start. A stale
      .next — e.g. one carrying container-absolute `/workspaces/...` paths from
      an earlier devcontainer build — makes Turbopack try to write to a
      read-only/nonexistent path, panic, and crash-loop ("blinking"). It is
      fully regenerated on boot, so wiping it is always safe.
      Deliberately clears the CONTENTS rather than `rm -rf ui/.next`: inside
      the devcontainer ui/.next is a named-volume mount point
      (.devcontainer/compose.yaml), and unlinking a mount point fails with
      "rm: cannot remove 'ui/.next': Device or resource busy".
    in:
      cmd: find ui/.next -mindepth 1 -delete

  - name: pypyr.steps.cmd
    description: Starting Next.js UI on :3100
    in:
      cmd: pnpm --dir ui dev
