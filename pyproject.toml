[tool.poetry]
name = "smart-wroclaw"
version = "0.1.0"
description = "Smart Wrocław — citizen assistant + issue reporting with a human-in-the-loop review for city maintenance."
authors = ["Smart Wrocław Team <dev@smart-wroclaw.example>"]
readme = "README.md"
# Poetry is rooted at the project root (smart_wroclaw/); the importable package
# `api` lives one level down at api/api, hence `from = "api"`.
packages = [{ include = "api", from = "api" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = ">=0.135.0,<0.136.0"
uvicorn = { extras = ["standard"], version = ">=0.43.0,<0.44.0" }
pydantic = ">=2.13.0,<3.0.0"
pydantic-settings = ">=2.13.0,<3.0.0"
pypika = ">=0.51.1,<0.52.0"
psycopg = { extras = ["binary", "pool"], version = ">=3.1.17,<4.0.0" }
psycopg2-binary = ">=2.9.9,<3.0.0"
sqlalchemy = ">=2.0.0,<3.0.0"
alembic = ">=1.18.0,<2.0.0"
inngest = ">=0.5.18,<0.6.0"
openai = ">=2.30.0,<3.0.0"
tenacity = ">=9.1.0,<10.0.0"
loguru = ">=0.7.3,<0.8.0"
python-dotenv = ">=1.2.0,<2.0.0"
anyio = ">=4.0.0,<5.0.0"
pyyaml = "^6.0"
# --- auth_bc (email + password login, JWT, email confirmation, reset) ---
bcrypt = ">=4.2.0,<5.0.0"
pyjwt = ">=2.9.0,<3.0.0"
resend = ">=2.0.0,<3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
pytest-asyncio = "^1.3.0"
pytest-mock = "^3.15.0"
pytest-cov = "^7.0.0"
black = "^26.3.1"
isort = "^8.0.0"
flake8 = "^7.3.0"
mypy = "^1.15.0"
pypyr = "^5.9.1"
pre-commit = "^4.6.0"
# Test data + parametrization, matching the imprv-api suite (see api/tests).
faker = "^38.0.0"
parameterized = "^0.9.0"

# ---------------------------------------------------------------------------
# pypyr task runner. Shortcuts below map `pypyr <name>` → a pipeline in dev/.
# Run them from the project root (smart_wroclaw/, where this pyproject.toml
# lives). The pipelines in dev/ orchestrate the whole stack (api + ui + deploy).
# Vars are interpolated into the pipelines via `pypyr.steps.configvars`
# (e.g. {src_dir}, {max_line_length}).
# ---------------------------------------------------------------------------
[tool.pypyr.vars]
src_dir = "api/api"
test_dir = "api/tests"
python_target_version = "py312"
max_line_length = "120"
min_coverage = "0"
coverage_dir = "coverage"
linter_ignore_errors = "D100,D101,D102,D103,D104,D105,D106,D107,E203,E231,W503,N806,E704"
linter_exclude = ".venv,migrations"
# Host port of the Inngest dev server (compose.yaml maps 8488:8288). The API +
# worker point at it via INNGEST_DEV so no signing key is needed locally.
inngest_dev_url = "http://127.0.0.1:8488"
# Default demo dataset for `pypyr seed_events` (override with dataset=<path>).
seed_dataset = "api/tests/manual/fake_events.json"

[tool.pypyr.shortcuts]
install = { pipeline_name = "dev/install" }
migrate = { pipeline_name = "dev/migrate" }
seed_events = { pipeline_name = "dev/seed_events" }
start_tilt = { pipeline_name = "dev/start_tilt" }
start_api = { pipeline_name = "dev/start_api" }
start_worker = { pipeline_name = "dev/start_worker" }
# Devcontainer path: one role=all backend process on :8101 that INHERITS the
# container's INNGEST_DEV=http://inngest:8288. Use this INSTEAD of start_api +
# start_worker inside the devcontainer — those set INNGEST_DEV to the native host
# port (127.0.0.1:8488), which is unreachable in the container and makes chat
# turns 500.
start_be = { pipeline_name = "dev/start_be" }
start_ui = { pipeline_name = "dev/start_ui" }
format = { pipeline_name = "dev/format" }
check_format = { pipeline_name = "dev/check_format" }
lint = { pipeline_name = "dev/lint" }
test = { pipeline_name = "dev/test" }
eval = { pipeline_name = "dev/eval" }
annotate = { pipeline_name = "dev/annotate" }
set_role = { pipeline_name = "dev/set_role" }
precommit = { pipeline_name = "dev/precommit" }
render_er = { pipeline_name = "dev/render_db_er_diagram" }

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["api/tests"]
markers = [
    "llm: tests that call a real LLM (skipped by `pypyr test`)",
    "slow: slow tests (skipped by `pypyr test`)",
    # Auto-applied to everything under api/tests/integration (needs a live
    # Postgres). Run unit-only with:  pytest -m "not integration"
    "integration: needs a real database / external infra",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
