# Alembic configuration. The DB URL is set at runtime by migrations/env.py from
# the app Config (env vars), so `sqlalchemy.url` below is only a placeholder.

[alembic]
script_location = %(here)s/api/adapters/db/migrations
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
# %(here)s = the dir holding this file (api/), so `import api` resolves whatever
# the cwd is — run `alembic -c api/alembic.ini …` from the project root.
prepend_sys_path = %(here)s
path_separator = os
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/smart_wroclaw


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
