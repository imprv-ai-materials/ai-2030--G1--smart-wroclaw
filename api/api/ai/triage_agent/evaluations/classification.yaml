# Evaluation: triage routes reports to the right category / department / severity.
# The offline heuristic is scored directly (no LLM); with a key set, the same
# dataset scores the model's structured output.
name: classification
description: Category / department / severity accuracy against triage_smoke.
dataset: triage_smoke
assertions:
  - id: category_match
    kind: field_equals
    field: category
  - id: department_match
    kind: field_equals
    field: department
  - id: critical_detected
    kind: field_equals
    field: severity
    only_when_expected: true
metrics:
  - accuracy
