# Smoke dataset for event categorisation — a tiny, hand-checked slice that mirrors
# the offline unit tests. The full dataset lives alongside it in this `datasets/`
# folder (category_dataset.jsonl, generated by ../eval/generate_dataset.py and
# editable via /.annotator); this file just keeps a fast in-package sanity set.
name: category_smoke
description: Representative open-text citizen reports with expected primary category.
cases:
  - id: water_leak
    text: Z hydrantu na Legnickiej leje się woda i zalewa cały chodnik.
    expect:
      primary_category: WATER
  - id: roads_pothole
    text: Ogromna dziura w jezdni na Krakowskiej, można urwać koło.
    expect:
      primary_category: ROADS
  - id: waste_overflow
    text: Kosze na śmieci przy placu zabaw są przepełnione od tygodnia.
    expect:
      primary_category: WASTE
  - id: greenery_tree
    text: Złamana gałąź wisi nad ścieżką w Parku Południowym.
    expect:
      primary_category: GREENERY
  - id: lighting_dark
    text: Nie świeci latarnia przy przejściu dla pieszych, wieczorem jest ciemno.
    expect:
      primary_category: LIGHTING
  - id: transport_stop
    text: Rozbita wiata przystankowa MPK na przystanku Rynek.
    expect:
      primary_category: PUBLIC_TRANSPORT
  - id: multi_tree_blocks_road
    text: Przewrócone drzewo całkowicie blokuje przejazd ulicą Sępią.
    expect:
      primary_category: GREENERY
      secondary_categories: [ROADS]
  - id: other_noise
    text: Głośna impreza w sąsiednim mieszkaniu do trzeciej w nocy.
    expect:
      primary_category: OTHER
