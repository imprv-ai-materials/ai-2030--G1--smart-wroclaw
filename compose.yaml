services:

  inngest:
    image: inngest/inngest:latest
    # Points at the WORKER process (uvicorn, role=worker, :8103) — only the
    # worker serves /api/inngest and executes background jobs, so a heavy triage
    # burst can't starve the REST API (:8101).
    #
    # --no-discovery stops the dev server probing other localhost ports (incl.
    # the API on :8101, which deliberately does NOT serve Inngest).
    command: >
      inngest dev --no-discovery -u http://host.docker.internal:8103/api/inngest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Host ports shifted +200 to avoid clashing with a sibling imprv service.
    ports:
      - "8488:8288"
      - "8489:8289"

  db:
    image: postgres:18
    restart: always
    environment:
      - POSTGRES_USER=${CONFIG__POSTGRES__USER}
      - POSTGRES_PASSWORD=${CONFIG__POSTGRES__PASSWORD}
      - POSTGRES_DB=${CONFIG__POSTGRES__DB}
    volumes:
      # postgres:18+ stores data in a version-specific subdir; mount the parent
      # (/var/lib/postgresql), NOT /var/lib/postgresql/data (the pre-18 path).
      # A Docker-managed named volume keeps DB state OUT of the source tree.
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'PGPASSWORD=${CONFIG__POSTGRES__PASSWORD} pg_isready -h localhost -U ${CONFIG__POSTGRES__USER} -d ${CONFIG__POSTGRES__DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5439:5432"

  label-studio:
    image: heartexlabs/label-studio:latest
    restart: unless-stopped
    environment:
      # Bootstrap a superuser (no signup wall) and silence outbound telemetry /
      # version checks — this instance is meant to stay on your machine.
      LABEL_STUDIO_USERNAME: admin@smart-wroclaw.local
      LABEL_STUDIO_PASSWORD: labelstudio
      COLLECT_ANALYTICS: "false"
      LATEST_VERSION_CHECK: "false"
      # Let Label Studio read the eval datasets bind-mounted below. The document
      # root is the ONLY host path it will serve, so it's scoped to eval/ alone.
      LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED: "true"
      LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT: /label-studio/files
      # Fixed local API token so the init sidecar below can authenticate
      # deterministically. Legacy tokens must be enabled for it to be accepted.
      LABEL_STUDIO_USER_TOKEN: &ls_token "smartwroclawlocaltoken0123456789"
      LABEL_STUDIO_ENABLE_LEGACY_API_TOKEN: "true"
    volumes:
      - label_studio_data:/label-studio/data
      # Every eval dataset (eval/*/data/) shows up inside the container here, so
      # any current OR future agent's data lands in Label Studio automatically —
      # add a Local Storage in the UI pointed at /label-studio/files/<agent>/data
      # to sync tasks, or just Import that folder's label_studio_import.json.
      # Read-only keeps the gold data immutable (never edit eval/** — see README).
      - ./eval:/label-studio/files:ro
    ports:
      - "8080:8080"

  # One-shot: waits for label-studio, then PRELOADS every eval dataset that ships
  # a label_studio_config.xml + label_studio_import.json as its own project
  # ("eval:<agent>"), importing the pre-annotated tasks. Idempotent — creates a
  # project only if missing and imports only if empty — so it re-runs harmlessly
  # on every `up`. Reuses the label-studio image purely for its Python (stdlib
  # only, no extra pull), and reads the datasets from the same eval/ tree.
  label-studio-init:
    image: heartexlabs/label-studio:latest
    restart: "no"
    depends_on:
      - label-studio
    entrypoint: ["python3", "/eval/label_studio_bootstrap.py"]
    environment:
      LS_URL: http://label-studio:8080
      LS_TOKEN: *ls_token
      EVAL_ROOT: /eval
    volumes:
      - ./eval:/eval:ro

  migrations:
    container_name: smart_wroclaw_migrations
    image: smart-wroclaw-migrations
    build:
      # Context is the repo-module root (smart_wroclaw/) — the same dir as this
      # compose file — so the Dockerfile can COPY the api/ package.
      context: .
      dockerfile: migrations.Dockerfile
    env_file:
      - api/.env
    environment:
      CONFIG__POSTGRES__HOST: db
      CONFIG__POSTGRES__PORT: 5432
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: {}
  label_studio_data: {}

networks:
  network: {}
